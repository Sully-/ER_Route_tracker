[package]
name = "route-tracking"
version = "0.4.2"
edition = "2021"
authors = ["Your Name <your@email.com>"]
license = "AGPL-3.0"
description = "Route tracking mod for Elden Ring"
repository = "https://github.com/YOUR_USERNAME/route-tracking"

[lib]
crate-type = ["cdylib"]
name = "route_tracking"

[[bin]]
name = "route-tracker-injector"
path = "src/injector.rs"

[[bin]]
name = "convert-map-icons"
path = "src/bin/convert_map_icons.rs"

[[bin]]
name = "convert-enemies"
path = "src/bin/convert_enemies.rs"

# =============================================================================
# DEPENDENCIES
# =============================================================================

[dependencies]
# --- libeldenring (game offsets per Elden Ring version) ---
# 1.9.9 supports Elden Ring up to 2.07.1
libeldenring = { git = "https://github.com/veeenu/eldenring-practice-tool.git", tag = "1.9.9" }

# --- hudhook for ImGui overlay (includes imgui as transitive dependency) ---
hudhook = { version = "0.9.0", features = ["dx12", "inject"], default-features = false }

# --- Utilities ---
once_cell = "1.19.0"
parking_lot = "0.12.1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

mem-rs = "0.1.7"

# --- HTTP client for real-time mode ---
ureq = { version = "2.9", features = ["json"] }

# --- Windows API ---
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
]

[profile.release]
strip = "symbols"
lto = true

